<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareWrite AI – Dashboard</title>
  <link rel="icon" href="Logo.png">
  <link rel="stylesheet" href="style.css">
  <!-- ✅ CONFIG FIRST – NO DUPLICATES -->
  <script src="config.js"></script>
  <!-- Dev tools only -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</head>
<body>

<!-- 🔒 PIN LOCK — FULL & CLOSED -->
<div id="pinLock" style="position:fixed;inset:0;background:#1a1111;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
    <h2 style="color:#009488;margin-bottom:20px;">🔒 CareWrite AI</h2>
    <p style="color:#ccc;">Enter 4‑digit PIN:</p>
    <input type="password" id="pinInput" maxlength="4" placeholder="****" style="padding:15px;font-size:24px;width:150px;text-align:center;border-radius:6px;border:0;margin:15px 0;">
    <button id="pinUnlock" class="btn-primary">Unlock</button>
</div>

<!-- 📱 MAIN APP — HIDDEN FIRST → SHOWS ONLY AFTER PIN ✅ -->
<div id="appContent" style="display:none;">
  
<div id="appContent"> <!-- ✅ ADD THIS LINE -->
  <h1>Speak a Note</h1>
  <p>Speak → Auto-Transcribe → AI Formatted Care Record</p>
  <!-- ALL YOUR BUTTONS/FORMS HERE -->
   <button id="recordBtn" class="btn-record">🎤 Record</button>

</div> <!-- ✅ CLOSE IT -->
  
 
  <div class="form-group">
    <label>Service User:</label>
    <select id="serviceUser">
  <option value="">— Select Name —</option>
  <option value="sarah">Sarah</option>
  <option value="james">James</option>
  <option value="maria">Maria</option>
  <option value="robert">Robert</option>
  <option value="emma">Emma</option>
    </select>
  </div>

  <textarea id="noteText" placeholder="Your note will appear here..."></textarea>

  <div class="actions">
    <button id="aiImprove" class="btn">🧠 AI Improve Note</button>
    <button id="editBtn" class="btn">✍️ Edit</button>
    <button id="saveBtn" class="btn-primary">✅ Save & Approve</button>
    <button id="formatBtn" class="btn-secondary">🤖 AI Format</button>
    <button id="tplDaily" class="btn">📝 Daily Note</button>
    <button id="tplIncident" class="btn">⚠️ Incident</button>
    <button id="tplMed" class="btn">💊 Medication</button>
    <button id="tplHandover" class="btn">🔄 Handover</button>
  </div>

  <div class="grid-cards">
    <div class="card"><h3>📄 New Note</h3></div>
    <div class="card"><h3>📂 My Records</h3></div>
    <div class="card"><h3>👥 Service Users</h3></div>
    <div class="card"><h3>⚙️ Settings</h3></div>
  </div>
</section>

<!-- ✅ APP LAST -->
<script src="app.js"></script>
</body>
</html>
