<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareWrite AI | Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div>
        <div class="logo">CareWrite AI</div>
        <div class="tagline">Less paperwork. More care.</div>
    </div>

    <div>
        👤 Staff
    </div>

</header>


<main class="container">

    <section class="welcome">

        <h1>Good morning 👋</h1>

        <p>
            Welcome to your CareWrite AI dashboard.
        </p>

    </section>


    <section class="cards">

        <div class="card">
            <h3>👥 People Supported</h3>
            <p>12 people</p>
        </div>

        <div class="card">
            <h3>📝 Notes Completed</h3>
            <p>8 today</p>
        </div>

        <div class="card">
            <h3>⏳ Awaiting Review</h3>
            <p>3 records</p>
        </div>

        <div class="card">
            <h3>⚠️ Incidents</h3>
            <p>1 requires review</p>
        </div>

    </section>


    <section class="actions">

        <h2>What would you like to do?</h2>

        <div class="button-grid">

            <button class="action-button voice">
                🎙️ Speak a Note
            </button>

            <button class="action-button">
                📝 Write a Note
            </button>

            <button class="action-button">
                ⚠️ Report an Incident
            </button>

            <button class="action-button">
                📋 Care Plan
            </button>

            <button class="action-button">
                👥 People
            </button>

        </div>

    </section>

</main>

</body>
</html>
