<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareWrite AI — Dashboard</title>
    <!-- ✅ PATHS FIXED: same folder = NO ../ -->
    <link rel="icon" href="Logo.png">
    <link rel="stylesheet" href="style.css">
    <!-- Debug -->
    <script src="https://cdn.jsdelivr.net/npm/eruda@2.5.0/eruda.min.js"></script>
    <script>eruda.init();</script>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>CareWrite AI</h1>
            <p>Care Documentation Dashboard</p>
            <!-- ✅ Back to main = ../ -->
            <a href="../index.html" class="back-link">← Back to Main Website</a>
        </header>

        <main class="app-main">
            <section class="card feature-main">
                <h2>🎤 Speak a Note</h2>
                <p>Speak → Auto-Transcribe → AI Formatted Care Record</p>

                <!-- ✅ EXACT ID: recordBtn + CORRECT BUTTON TEXT -->
                <button id="recordBtn" class="btn-record">🎙️ Start Recording</button>

                <div class="output">
                    <h3>Your Draft Note</h3>
                                    <!-- 👤 SERVICE USER DROPDOWN - NEW! -->
                <div class="user-select">
                    <label>Service User:</label>
                    <select id="serviceUser">
                        <option value="">— Select Name —</option>
                        <option value="Jane Doe">Jane Doe</option>
                        <option value="John Smith">John Smith</option>
                        <option value="Sarah Lee">Sarah Lee</option>
                        <option value="Robert Jones">Robert Jones</option>
                        <option value="Other">Other / Not Listed</option>
                    </select>
                </div>

                <!-- Your existing textarea stays here -->
                    <!-- ✅ EXACT ID: noteText -->
                    <textarea id="noteText" placeholder="Text appears here..." readonly></textarea>
                </div>

                <div class="actions">
                    <button id="editBtn" class="btn">✍️ Edit</button>
                    <button id="saveBtn" class="btn-primary">✅ Save & Approve</button>
                    <button id="formatBtn" class="btn-secondary">🤖 AI Format</button>
                     <!-- 📋 NEW TEMPLATE BUTTONS -->
                    <button id="tplDaily" class="btn">📝 Daily Note</button>
                    <button id="tplIncident" class="btn">⚠️ Incident</button>
                    <button id="tplMed" class="btn">💊 Medication</button>
                    <button id="tplHandover" class="btn">🔄 Handover</button>
                </div>

   
                </div>
            </section>

            <div class="grid-cards">
                <div class="card"><h3>📝 New Note</h3></div>
                <div class="card"><h3>📁 My Records</h3></div>
                <div class="card"><h3>👥 Service Users</h3></div>
                <div class="card"><h3>⚙️ Settings</h3></div>
            </div>
        </main>
    </div>
<script src="app.js"></script>
    </body>
